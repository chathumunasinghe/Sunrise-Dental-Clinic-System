name: Sunrise Dental CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project structure
        run: |
          echo "Checking Sunrise Dental project..."
          test -f WebContent/WEB-INF/web.xml
          test -d src
          test -d WebContent
          echo "Project structure check passed."

      - name: Compile Java source
        run: |
          mkdir -p build/classes
          find src -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -d build/classes @sources.txt
            echo "Java compilation completed."
          else
            echo "No Java source files found."
          fi

      - name: Verify web application files
        run: |
          test -f WebContent/WEB-INF/web.xml
          echo "web.xml verified."
          echo "Web application structure verified successfully."