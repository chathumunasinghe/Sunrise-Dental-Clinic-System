<svg viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d8f83"/>
      <stop offset="100%" stop-color="#0b6b62"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eafffb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <rect width="560" height="620" fill="url(#skyGrad)"/>
  <circle cx="280" cy="230" r="300" fill="url(#glow)"/>

  <!-- soft floating dots -->
  <circle cx="70" cy="90" r="4" fill="#ffffff" opacity="0.35"/>
  <circle cx="500" cy="140" r="6" fill="#ffffff" opacity="0.25"/>
  <circle cx="450" cy="480" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="60" cy="500" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="330" r="3" fill="#ffffff" opacity="0.25"/>

  <!-- large friendly tooth mascot -->
  <g transform="translate(140,120)">
    <path d="M140 0
             C60 0 10 55 10 120
             C10 175 30 205 42 250
             C50 282 55 320 76 320
             C96 320 100 260 140 260
             C180 260 184 320 204 320
             C225 320 230 282 238 250
             C250 205 270 175 270 120
             C270 55 220 0 140 0 Z"
          fill="url(#toothGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- rosy cheeks / eyes for a friendly, approachable brand feel -->
    <circle cx="100" cy="120" r="9" fill="#0b6b62"/>
    <circle cx="180" cy="120" r="9" fill="#0b6b62"/>
    <circle cx="104" cy="116" r="2.4" fill="#ffffff"/>
    <circle cx="184" cy="116" r="2.4" fill="#ffffff"/>
    <path d="M110 160 Q140 182 170 160" stroke="#0b6b62" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="140" r="10" fill="#ffb4c6" opacity="0.55"/>
    <circle cx="210" cy="140" r="10" fill="#ffb4c6" opacity="0.55"/>
    <!-- sparkle -->
    <path d="M205 40 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- floating calendar card -->
  <g transform="translate(30,380)">
    <rect x="0" y="0" width="130" height="110" rx="14" fill="#ffffff" opacity="0.96"/>
    <rect x="0" y="0" width="130" height="30" rx="14" fill="#0f9b8e"/>
    <rect x="0" y="16" width="130" height="14" fill="#0f9b8e"/>
    <circle cx="24" cy="15" r="4" fill="#ffffff"/>
    <circle cx="106" cy="15" r="4" fill="#ffffff"/>
    <g fill="#0b6b62" opacity="0.85">
      <rect x="16" y="46" width="18" height="14" rx="3"/>
      <rect x="42" y="46" width="18" height="14" rx="3" fill="#2dd4bf"/>
      <rect x="68" y="46" width="18" height="14" rx="3"/>
      <rect x="94" y="46" width="18" height="14" rx="3"/>
      <rect x="16" y="70" width="18" height="14" rx="3"/>
      <rect x="42" y="70" width="18" height="14" rx="3"/>
      <rect x="68" y="70" width="18" height="14" rx="3" fill="#2dd4bf"/>
      <rect x="94" y="70" width="18" height="14" rx="3"/>
    </g>
  </g>

  <!-- floating clipboard / chart card -->
  <g transform="translate(370,420)">
    <rect x="0" y="0" width="120" height="120" rx="14" fill="#ffffff" opacity="0.96"/>
    <rect x="16" y="18" width="88" height="8" rx="4" fill="#0f9b8e"/>
    <rect x="16" y="36" width="60" height="6" rx="3" fill="#cfeee9"/>
    <polyline points="16,95 40,72 60,84 88,50 104,60" fill="none" stroke="#0f9b8e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="60" r="4.5" fill="#2dd4bf"/>
  </g>
</svg>
